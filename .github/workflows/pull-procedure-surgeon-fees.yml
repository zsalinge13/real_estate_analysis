name: Pull national procedure surgeon fees

on:
  schedule:
    # 16:00 UTC on January 1 only (once a year).
    - cron: "0 16 1 1 *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pull-procedure-surgeon-fees
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull national procedure counts and surgeon fees
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REFRESH_REVIEW_WEBHOOK_URL: ${{ secrets.REFRESH_REVIEW_WEBHOOK_URL }}
          REFRESH_REVIEW_WEBHOOK_KEY: ${{ secrets.REFRESH_REVIEW_WEBHOOK_KEY }}
        run: python pull_procedure_surgeon_fees.py
      - name: Upload procedure surgeon fee CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedure-surgeon-fees
          path: procedure_surgeon_fees.csv
          retention-days: 90
          if-no-files-found: error
      - name: Export Supabase backup CSV
        id: backup
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_supabase_backup.py procedure_surgeon_fees
      - name: Upload Supabase backup CSV
        if: failure() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: procedure-surgeon-fees
          path: procedure_surgeon_fees.csv
          retention-days: 90
          if-no-files-found: error
