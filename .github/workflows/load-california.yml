name: Load California ZIP inventory

# Scheduled and manual runs replace public.redfin_real_estate_value with every
# month in the Realtor history file. Those runs are not started by Census.
# After the full load succeeds, they download census-zip-population with
# actions/download-artifact from the latest successful Pull Census ZIP
# population run on main, then run the census-year join and rank. Each of
# those runs uploads redfin-real-estate-value, zip-census-redfin-join,
# cash-pay-zip-rank, and procedure-surgeon-fees.
# A successful Pull Census ZIP population run on main starts the census-year
# job. That job loads only the Census acs_year, does not delete older months,
# and uses the census-zip-population artifact from the run that started it.
# It uploads the join CSV, then ranks cash-pay ZIPs from that join. That rank
# writes procedure_surgeon_fees.csv, including marketing_bullets for every
# report year, and that job uploads the same four artifacts. An in-progress
# run is not cancelled. This file does not start another run.
# On every run, the competition_trends job then builds competition-trends from
# this run's join and fees (or Supabase when a job before it failed). NPPES is
# read every run and Google Trends about once a week; either failing keeps the
# last good values. That job never fails the run and always uploads the CSV.
on:
  schedule:
    # 16:00 UTC on January 1 and July 1 only (every six months).
    - cron: "0 16 1 1,7 *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Pull Census ZIP population"]
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: load-california
  cancel-in-progress: false

jobs:
  load:
    name: Load full California ZIP inventory
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load California ZIP inventory
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REFRESH_REVIEW_WEBHOOK_URL: ${{ secrets.REFRESH_REVIEW_WEBHOOK_URL }}
          REFRESH_REVIEW_WEBHOOK_KEY: ${{ secrets.REFRESH_REVIEW_WEBHOOK_KEY }}
        run: python load_california.py
      - name: Upload Redfin real estate value CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redfin-real-estate-value
          path: california_zip_inventory.csv
          retention-days: 90
          if-no-files-found: error
      - name: Export Supabase backup CSV
        id: backup
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_supabase_backup.py redfin_real_estate_value
      - name: Upload Supabase backup CSV
        if: failure() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: redfin-real-estate-value
          path: california_zip_inventory.csv
          retention-days: 90
          if-no-files-found: error

  join_rank_full:
    name: Join and rank after the full load
    needs: load
    if: ${{ github.event_name != 'workflow_run' && needs.load.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download the full Redfin inventory from this run
        uses: actions/download-artifact@v4
        with:
          name: redfin-real-estate-value
          path: .
      - name: Find the latest successful Pull Census ZIP population run
        id: census_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --workflow pull-census-zip-population.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')"
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "No successful Pull Census ZIP population run on main." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Latest successful Pull Census ZIP population run: ${run_id}"
      - name: Download Census ZIP population artifact
        uses: actions/download-artifact@v4
        with:
          name: census-zip-population
          path: census_artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.census_run.outputs.run_id }}
      - name: Join Census ZIPs to the latest Redfin month
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python join_census_redfin.py census_artifact/census_zip_population.csv california_zip_inventory.csv
      - name: Upload Census-Redfin join CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zip-census-redfin-join
          path: zip_census_redfin_join.csv
          retention-days: 90
          if-no-files-found: error
      - name: Rank cash-pay ZIP personas
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python rank_cash_pay_zips.py zip_census_redfin_join.csv
      - name: Upload cash-pay ZIP rank CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cash-pay-zip-rank
          path: cash_pay_zip_rank.csv
          retention-days: 90
          if-no-files-found: error
      - name: Upload procedure surgeon fees CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedure-surgeon-fees
          path: procedure_surgeon_fees.csv
          retention-days: 90
          if-no-files-found: error

  load_census_year:
    name: Load Census-year Redfin and join
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download Census ZIP population artifact
        uses: actions/download-artifact@v4
        with:
          name: census-zip-population
          path: census_artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read the Census acs_year
        id: census_year
        run: |
          set -euo pipefail
          year="$(python join_census_redfin.py --print-acs-year census_artifact/census_zip_population.csv)"
          [[ "$year" =~ ^[0-9]{4}$ ]]
          echo "acs_year=${year}" >> "$GITHUB_OUTPUT"
          echo "Census acs_year: ${year}"
      - name: Load Redfin months for the Census year
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REFRESH_REVIEW_WEBHOOK_URL: ${{ secrets.REFRESH_REVIEW_WEBHOOK_URL }}
          REFRESH_REVIEW_WEBHOOK_KEY: ${{ secrets.REFRESH_REVIEW_WEBHOOK_KEY }}
        run: python load_california.py --census-year "${{ steps.census_year.outputs.acs_year }}"
      - name: Upload Redfin real estate value CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redfin-real-estate-value
          path: california_zip_inventory.csv
          retention-days: 90
          if-no-files-found: error
      - name: Export Supabase backup CSV
        id: backup
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_supabase_backup.py redfin_real_estate_value
      - name: Upload Supabase backup CSV
        if: failure() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: redfin-real-estate-value
          path: california_zip_inventory.csv
          retention-days: 90
          if-no-files-found: error
      - name: Join Census ZIPs to the latest Redfin month
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python join_census_redfin.py census_artifact/census_zip_population.csv california_zip_inventory.csv
      - name: Upload Census-Redfin join CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zip-census-redfin-join
          path: zip_census_redfin_join.csv
          retention-days: 90
          if-no-files-found: error
      - name: Rank cash-pay ZIP personas
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python rank_cash_pay_zips.py zip_census_redfin_join.csv
      - name: Upload cash-pay ZIP rank CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cash-pay-zip-rank
          path: cash_pay_zip_rank.csv
          retention-days: 90
          if-no-files-found: error
      - name: Upload procedure surgeon fees CSV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procedure-surgeon-fees
          path: procedure_surgeon_fees.csv
          retention-days: 90
          if-no-files-found: error

  competition_trends:
    name: Build competition_trends
    needs: [join_rank_full, load_census_year]
    if: ${{ !cancelled() }}
    # A Trends, NPPES, or Supabase problem here never fails the California run.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download the ZIP join from this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zip-census-redfin-join
          path: inputs/join
      - name: Download procedure surgeon fees from this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: procedure-surgeon-fees
          path: inputs/fees
      - name: Build competition_trends
        id: competition
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ -f inputs/join/zip_census_redfin_join.csv ]]; then
            args+=(--join inputs/join/zip_census_redfin_join.csv)
          else
            echo "No join artifact in this run. Reading public.zip_census_redfin_join."
          fi
          if [[ -f inputs/fees/procedure_surgeon_fees.csv ]]; then
            args+=(--procedures inputs/fees/procedure_surgeon_fees.csv)
          fi
          python pull_competition_trends.py "${args[@]}"
      - name: Export the last good competition_trends
        if: ${{ !cancelled() && hashFiles('competition_trends.csv') == '' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_supabase_backup.py competition_trends
      - name: Upload competition trends CSV
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: competition-trends
          path: competition_trends.csv
          retention-days: 90
          if-no-files-found: warn
